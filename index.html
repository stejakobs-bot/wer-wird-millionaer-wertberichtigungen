<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wer wird Millionär? Wertberichtigungen</title>
<style>
:root{box-sizing:border-box;--bg:#0a1240;--bg2:#040720;--gold:#f5c044;--ink:#f3f1ff;--panel:#16227a;--ok:#2e9d4f;--bad:#c53a3a;--mute:#9aa4e0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,var(--bg) 0%,var(--bg2) 75%) var(--bg2);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 210px;gap:18px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.ladder{order:-1;display:flex;flex-wrap:wrap;gap:4px;padding:8px}.ladder li{flex:1 1 18%;text-align:center;padding:2px;font-size:.72rem}}
h1{font-family:Georgia,serif;font-weight:700;font-size:1.5rem;margin:0 0 4px;color:var(--gold)}
.sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.jok{display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.j{border:2px solid var(--gold);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:700}
.j:disabled{opacity:.35;text-decoration:line-through;cursor:default}
.q{border:2px solid var(--gold);background:linear-gradient(var(--panel),#0e1760);border-radius:14px;padding:20px;font-size:1.2rem;font-family:Georgia,serif;margin-bottom:14px;min-height:96px;display:flex;align-items:center}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.ans{grid-template-columns:1fr}}
.a{display:flex;gap:10px;text-align:left;border:2px solid var(--mute);background:var(--panel);border-radius:999px;padding:12px 18px;transition:background .2s,border-color .2s}
.a b{color:var(--gold)}
.a:hover:not(:disabled){border-color:var(--gold)}
.a:focus-visible,.j:focus-visible,.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.a.sel{background:#b8860b;border-color:var(--gold)}
.a.ok{background:var(--ok);border-color:#9fe0b4}
.a.bad{background:var(--bad);border-color:#f0a0a0}
.a.gone{visibility:hidden}
.a:disabled{cursor:default}
.box{margin-top:14px;border-left:4px solid var(--gold);background:#0c1560;padding:12px 16px;border-radius:0 10px 10px 0}
.go{margin-top:12px;border:0;background:var(--gold);color:#1a1300;font-weight:700;padding:10px 22px;border-radius:999px}
.out{background:transparent;border:2px solid var(--mute);color:var(--ink);margin-left:8px}
.bars{display:flex;gap:14px;align-items:flex-end;height:110px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:.85rem}
.bars i{display:block;background:var(--gold);border-radius:4px 4px 0 0;margin-bottom:2px}
.ladder{list-style:none;margin:0;padding:10px 12px;background:#0a1252;border:2px solid #2a3aa8;border-radius:14px;display:flex;flex-direction:column-reverse;align-self:start}
.ladder li{padding:3px 8px;border-radius:6px;display:flex;justify-content:space-between;color:var(--mute);font-variant-numeric:tabular-nums}
.ladder li.safe{color:var(--ink);font-weight:700}
.ladder li.cur{background:var(--gold);color:#1a1300;font-weight:700}
.ladder li.done{color:#7fd69a}
.end{text-align:center;padding:30px 10px}
.end .big{font-family:Georgia,serif;font-size:2.4rem;color:var(--gold);margin:6px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main id="main"></main>
  <ol class="ladder" id="ladder" aria-label="Gewinnstufen"></ol>
</div>
<script>
// Erste Antwort = richtige Antwort (wird beim Spielstart gemischt)
const Q=[
{q:"Wofür steht die Abkürzung EWB?",a:["Einzelwertberichtigung","Eigenwechselbestand","Einzelwarenbuchung","Erfolgswirksame Bilanzposition"],e:"EWB = Einzelwertberichtigung. Sie wird für einzelne Forderungen mit erkennbarem Ausfallrisiko gebildet."},
{q:"Wofür steht die Abkürzung PWB?",a:["Pauschalwertberichtigung","Privatwechselbestand","Periodenweise Buchung","Passive Wertbestandsbilanz"],e:"PWB = Pauschalwertberichtigung für das latente (versteckte) Ausfallrisiko der übrigen Forderungen."},
{q:"Mit welchem Wert wird eine einwandfreie Forderung bilanziert?",a:["Mit dem Nennwert","Mit dem wahrscheinlichen Wert","Mit 50 % des Nennwerts","Mit dem Wert null"],e:"Bei einwandfreien Forderungen besteht kein Zweifel an der Rückzahlung, daher Bilanzierung zum Nennwert."},
{q:"Wann muss eine Einzelwertberichtigung gebildet werden?",a:["Bei einer Einzelforderung mit erkennbarem Ausfallrisiko","Bei jeder Forderung der Bank","Nur wenn der Ausfall endgültig feststeht","Nur bei Forderungen an öffentlich-rechtliche Körperschaften"],e:"Besteht bei einer Einzelforderung ein Ausfallrisiko (zweifelhafte Forderung), ist eine EWB zu bilden."},
{q:"Moritz Wagner ist unauffindbar nach Alaska ausgewandert und schuldet der Bank 5.000 EUR. Wie ist die Forderung einzustufen?",a:["Uneinbringlich","Einwandfrei","Zweifelhaft mit Teilausfall","Pauschal wertberichtigt"],e:"Der Ausfall steht fest, die Forderung ist uneinbringlich und wird abgeschrieben."},
{q:"Wie wird eine uneinbringliche Forderung von 5.000 EUR gebucht?",a:["Abschreibungen auf Forderungen an Kontokorrentkredit (Kunde)","Kontokorrentkredit (Kunde) an Abschreibungen auf Forderungen","EWB an Kontokorrentkredit (Kunde)","Abschreibungen auf Forderungen an EWB"],e:"Uneinbringliche Forderungen werden direkt abgeschrieben: Abschreibungen auf Forderungen an Kundenkonto."},
{q:"Die Wagner GmbH schuldet 60.000 EUR und hat Insolvenz beantragt. Erwartet werden noch 10.000 EUR. Wie hoch ist die EWB?",a:["50.000 EUR","10.000 EUR","60.000 EUR","6.000 EUR"],e:"EWB = erwarteter Verlust = 60.000 – 10.000 = 50.000 EUR."},
{q:"Wie wird die Bildung der EWB (50.000 EUR) gebucht?",a:["Abschreibungen auf Forderungen an EWB","EWB an Abschreibungen auf Forderungen","EWB an Kontokorrentkredit (Kunde)","Kontokorrentkredit (Kunde) an EWB"],e:"Indirekte Abschreibung: Abschreibungen auf Forderungen (Aufwand) an EWB (passives Bestandskonto). Die Forderung bleibt zunächst mit 60.000 EUR stehen."},
{q:"Die Forderung der Wagner GmbH (60.000 EUR, EWB 50.000 EUR) fällt vollständig aus. Welcher Buchungssatz ist richtig?",a:["EWB 50.000 und Abschreibungen auf Forderungen 10.000 an Kundenkonto 60.000","EWB 60.000 an Kundenkonto 60.000","Abschreibungen auf Forderungen 60.000 an Kundenkonto 60.000","Bank 10.000 an Kundenkonto 10.000"],e:"Die gebildete EWB wird verbraucht (50.000). Der nicht gedeckte Rest von 10.000 EUR wird als Abschreibung auf Forderungen gebucht."},
{q:"Die Wagner GmbH überweist 15.000 EUR, der Rest fällt aus. Wie hoch ist der Ertrag aus Zuschreibungen zu Forderungen?",a:["5.000 EUR","15.000 EUR","10.000 EUR","Es entsteht kein Ertrag"],e:"Erwartet waren 10.000 EUR, eingegangen sind 15.000 EUR. Zu viel gebildete EWB: 5.000 EUR. Buchung: Bank 15.000 und EWB 50.000 an Kundenkonto 60.000 und Erträge aus Zuschreibungen 5.000 (laut Arbeitsblatt: EWB-Verbrauch 45.000 plus Ertrag 5.000)."},
{q:"Wie berechnet sich der tatsächliche Forderungsausfall eines Geschäftsjahres?",a:["Verbrauch an EWB + direkt abgeschriebene Forderungen – Zahlungseingänge auf abgeschriebene Forderungen","Verbrauch an EWB – direkt abgeschriebene Forderungen + Zahlungseingänge auf abgeschriebene Forderungen","Direkt abgeschriebene Forderungen + Zahlungseingänge auf abgeschriebene Forderungen","Bestand der EWB + Bestand der PWB"],e:"Tatsächlicher Ausfall = EWB-Verbrauch + Direktabschreibungen – Eingänge auf bereits abgeschriebene Forderungen."},
{q:"Der durchschnittliche Forderungsausfall der letzten 5 Jahre beträgt 128,2 TEUR. Wie hoch ist der maßgebliche Forderungsausfall nach 40 % Abschlag?",a:["76,92 TEUR","51,28 TEUR","128,2 TEUR","179,48 TEUR"],e:"40 % von 128,2 = 51,28. Maßgeblicher Ausfall = 128,2 – 51,28 = 76,92 TEUR."},
{q:"Maßgeblicher Forderungsausfall: 16,33 TEUR. Durchschnittliches risikobehaftetes Kreditvolumen: 7.769 TEUR. Wie hoch ist der PWB-Satz?",a:["ca. 0,21 %","ca. 2,1 %","ca. 0,021 %","ca. 21 %"],e:"PWB-Satz = 16,33 × 100 / 7.769 ≈ 0,21 %."},
{q:"Mit dem PWB-Satz wird multipliziert …",a:["das risikobehaftete Kreditvolumen zum Stichtag abzüglich der einzelwertberichtigten Forderungen","das durchschnittliche Kreditvolumen der letzten 5 Jahre","das gesamte Kreditvolumen einschließlich einzelwertberichtigter Forderungen","der maßgebliche Forderungsausfall"],e:"Bemessungsgrundlage: risikobehaftete Forderungen zum Stichtag – EWB = verbleibendes Kreditvolumen. Dieses wird mit dem PWB-Satz multipliziert."},
{q:"Die berechnete PWB beträgt 12.031 EUR, im Vorjahr wurden 20.000 EUR gebildet. Wie wird gebucht?",a:["PWB an Erträge aus Zuschreibungen zu Forderungen, 7.969 EUR","Abschreibungen auf Forderungen an PWB, 12.031 EUR","PWB an Erträge aus Zuschreibungen zu Forderungen, 12.031 EUR","Abschreibungen auf Forderungen an PWB, 7.969 EUR"],e:"Es ist mehr PWB gebildet als nötig. Die Differenz von 20.000 – 12.031 = 7.969 EUR wird aufgelöst: PWB an Erträge aus Zuschreibungen zu Forderungen."}
];
const L=[50,100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,500000,1000000];
const SAFE=[4,9];
const eur=n=>n.toLocaleString("de-DE")+" €";
const $=s=>document.querySelector(s);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function start(){S={i:0,locked:false,hidden:[],used:{f:false,p:false,t:false},info:"",ord:sh([0,1,2,3])};draw()}
function safeAt(i){let w=0;SAFE.forEach(k=>{if(i>k)w=L[k]});return w}
function ladder(){$("#ladder").innerHTML=L.map((v,k)=>`<li class="${SAFE.includes(k)?"safe ":""}${k===S.i&&!S.over?"cur ":""}${k<S.i?"done":""}"><span>${k+1}</span><span>${eur(v)}</span></li>`).join("")}
function draw(){
  ladder();
  const q=Q[S.i],m=$("#main");
  m.innerHTML=`<h1>Wer wird Millionär?</h1><p class="sub">Rechnungswesen: Einzel- und Pauschalwertberichtigungen</p>
  <div class="top"><strong>Frage ${S.i+1} von 15 für ${eur(L[S.i])}</strong>
  <div class="jok"><button class="j" id="jf" ${S.used.f?"disabled":""}>50:50</button><button class="j" id="jp" ${S.used.p?"disabled":""}>Publikum</button><button class="j" id="jt" ${S.used.t?"disabled":""}>Telefon</button></div></div>
  <div class="q">${q.q}</div>
  <div class="ans">${S.ord.map((k,n)=>`<button class="a ${S.hidden.includes(k)?"gone":""}" data-k="${k}"><b>${"ABCD"[n]}:</b><span>${q.a[k]}</span></button>`).join("")}</div>
  <div id="info">${S.info}</div>
  <div style="margin-top:14px"><button class="go out" id="quit" style="margin-left:0">Aussteigen mit ${eur(S.i?L[S.i-1]:0)}</button></div>`;
  m.querySelectorAll(".a").forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
  $("#jf").onclick=fifty;$("#jp").onclick=aud;$("#jt").onclick=phone;
  $("#quit").onclick=()=>finish("Du steigst aus.",S.i?L[S.i-1]:0);
}
function vis(){return S.ord.filter(k=>!S.hidden.includes(k))}
function fifty(){S.used.f=true;S.hidden=sh([1,2,3]).slice(0,2);S.info="";draw()}
function aud(){
  S.used.p=true;const v=vis(),p=Math.max(35,92-S.i*4)+Math.round(Math.random()*8-4),w=v.filter(k=>k!==0);
  let rest=100-p,r={0:p};w.forEach((k,n)=>{const x=n===w.length-1?rest:Math.round(rest*(0.3+Math.random()*0.4));r[k]=x;rest-=x});
  S.info=`<div class="box"><strong>Das Publikum stimmt ab:</strong><div class="bars">${S.ord.map((k,n)=>v.includes(k)?`<div><i style="height:${r[k]}px"></i>${"ABCD"[n]} ${r[k]} %</div>`:`<div></div>`).join("")}</div></div>`;draw()}
function phone(){
  S.used.t=true;const v=vis(),sure=Math.max(40,95-S.i*5),right=Math.random()*100<sure+10,
  w=v.filter(k=>k!==0),k=right?0:w[Math.floor(Math.random()*w.length)];
  S.info=`<div class="box"><strong>Dein Telefonjoker:</strong> „Ich bin mir zu etwa ${sure} % sicher. Ich würde ${"ABCD"[S.ord.indexOf(k)]} nehmen.“</div>`;draw()}
function pick(k,b){
  if(S.locked)return;S.locked=true;b.classList.add("sel");
  document.querySelectorAll(".a,.j,#quit").forEach(x=>x.disabled=true);
  setTimeout(()=>{
    const q=Q[S.i],ok=k===0;
    document.querySelectorAll(".a").forEach(x=>{if(+x.dataset.k===0)x.classList.add("ok");else if(x===b)x.classList.add("bad");x.classList.remove("sel");if(+x.dataset.k===0)x.classList.add("ok")});
    const last=S.i===14;
    $("#info").innerHTML=`<div class="box"><strong>${ok?"Richtig!":"Leider falsch."}</strong> ${q.e}<br><button class="go" id="nx">${ok?(last?"Zur Auswertung":"Nächste Frage"):"Weiter"}</button></div>`;
    $("#nx").focus();
    $("#nx").onclick=()=>{
      if(!ok)return finish("Das war leider falsch. Die richtige Antwort war: "+q.a[0],safeAt(S.i));
      if(last)return finish("Du bist Millionär!",L[14]);
      S.i++;S.locked=false;S.hidden=[];S.info="";S.ord=sh([0,1,2,3]);draw()};
  },1400);
}
function finish(msg,amt){
  S.over=true;ladder();
  $("#main").innerHTML=`<div class="end"><h1>Wer wird Millionär?</h1><p>${msg}</p><div class="big">${eur(amt)}</div><p class="sub">${amt===1000000?"Alle 15 Fragen richtig!":"Gewonnen nach "+(S.i)+" richtig beantworteten Fragen."}</p><button class="go" id="again">Neues Spiel</button></div>`;
  $("#again").onclick=start;
}
start();
</script>
</body>
</html>
